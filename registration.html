<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
    <link rel="stylesheet" href="registration.css">
</head>
<body>
    <main>
        <form id="regForm" class="reg-form" action="" method="post">
           <label for="fullName">Full Name</label>
            <input id="fullName" class="full-name" type="text">
           
            <label for="email">Email</label>
                <input id="email" class="email" type="email">
                
            <label for="address">Address</label>
            <input id="address" class="address" type="text">
            
            <label for="password">Password</label>
            <input id="password" class="id" type="password">
            
            <label for="confirmPassword">Confirm Password</label>
            <input id="confirmPassword" class="confirm-password" type="password">
            <br>
           <button id="registerButton" class="register-button" type="submit">Register</button>
        </form>
    </main>
    <script type="module" src="script.js"></script>
</body>
</html>
